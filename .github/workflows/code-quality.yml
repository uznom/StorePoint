name: StorePoint v2 — Code Quality, <800 Line Ceiling & Security Gate

on:
  push:
    branches:
      - main
      - v2
  pull_request:
    branches:
      - main
      - v2
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Line Ceiling (<800), Typecheck, Tests & Secret Scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js 22 & Corepack
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Enable Corepack & Install Dependencies
        run: |
          corepack enable
          corepack pnpm install --frozen-lockfile

      - name: Enforce < 800 Lines per File Ceiling
        run: node scripts/check-line-limits.mjs

      - name: Secrets & Leak Prevention Audit
        run: |
          LEAKED_KEYS=$(git ls-files | grep -E '\.(jks|keystore|pem|pk8|key)$' || true)
          if [ -n "$LEAKED_KEYS" ]; then
            echo "::error::Leaked key material found in git tracking: $LEAKED_KEYS"
            exit 1
          fi
          LEAKED_ENV=$(git ls-files | grep -E '(^|/)\.env$' || true)
          if [ -n "$LEAKED_ENV" ]; then
            echo "::error::Active .env file found tracked in git: $LEAKED_ENV"
            exit 1
          fi

      - name: Build, Typecheck & Run Test Suite
        run: corepack pnpm verify
