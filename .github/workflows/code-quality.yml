name: Code Quality & Security Audit

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read

jobs:
  secret-audit:
    name: Secret & Keystore Safety Audit
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Secrets & Leak Prevention Audit
        run: |
          echo "Checking for accidental tracking of sensitive files or private keys..."
          LEAKED_KEYS=$(git ls-files | grep -E '\.(jks|keystore|pem|pk8|key)$' || true)
          if [ -n "$LEAKED_KEYS" ]; then
            echo "::error::Leaked key material found in git tracking: $LEAKED_KEYS"
            exit 1
          fi

          LEAKED_ENV=$(git ls-files | grep -E '(^|/)\.env$' || true)
          if [ -n "$LEAKED_ENV" ]; then
            echo "::error::Active .env file found tracked in git: $LEAKED_ENV"
            exit 1
          fi

          echo "Zero leaked credentials or tracked keys detected. Security audit PASSED."

  android-quality:
    name: Kotlin Build, <800 LOC Audit & Unit Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Enforce <800 LOC Source Ceiling
        run: |
          VIOLATIONS=$(find app/src/main/java -name '*.kt' -exec wc -l {} + | awk '$1 >= 800 && $2 != "total" { print $1, $2 }')
          if [ -n "$VIOLATIONS" ]; then
            echo "::error::Kotlin source files exceeding 800 LOC ceiling:"
            echo "$VIOLATIONS"
            exit 1
          fi
          echo "All Kotlin source files are under 800 LOC."

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Run Unit Tests & Debug Lint
        run: |
          chmod +x gradlew
          ./gradlew testDebugUnitTest lintDebug --stacktrace
